<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실험 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f7f6f3;
      --surface:    #ffffff;
      --border:     #e8e7e4;
      --border-2:   #f0efec;
      --txt-1:      #1a1917;
      --txt-2:      #706f6b;
      --txt-3:      #a8a7a2;
      --accent:     #5b5bd6;
      --accent-bg:  #f0f0ff;
      --radius-sm:  5px;
      --radius-md:  8px;
      --radius-lg:  10px;
    }

    body {
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Pretendard', BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--txt-1);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── TOP BAR ── */
    .topbar {
      height: 44px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      flex-shrink: 0;
    }
    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
      color: var(--txt-1);
      padding-right: 12px;
      border-right: 1px solid var(--border);
      margin-right: 4px;
    }
    .brand-icon {
      width: 22px; height: 22px;
      background: var(--accent);
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .breadcrumb {
      display: flex; align-items: center; gap: 6px;
      color: var(--txt-3);
      font-size: 13px;
    }
    .breadcrumb span { color: var(--txt-1); font-weight: 500; }
    .breadcrumb svg { flex-shrink: 0; }
    .topbar-right {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
    }
    .conn-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 11px;
      color: var(--txt-3);
    }
    .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.12s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 10px;
      background: var(--surface);
      color: var(--txt-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s;
    }
    .btn-secondary:hover { background: var(--bg); }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 232px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    .sidebar-search {
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--border-2);
    }
    .sidebar-search input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 5px 8px;
      font-size: 12px;
      color: var(--txt-1);
      outline: none;
    }
    .sidebar-search input::placeholder { color: var(--txt-3); }
    .sidebar-search input:focus { border-color: var(--accent); }
    .sidebar-body { flex: 1; overflow-y: auto; padding: 6px 0; }

    .sidebar-group-label {
      padding: 12px 12px 4px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--txt-3);
    }
    .exp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      margin: 0 4px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.1s;
      border-left: 2px solid transparent;
    }
    .exp-row:hover { background: var(--bg); }
    .exp-row.active { background: var(--accent-bg); border-left-color: var(--accent); }
    .exp-row.active .exp-row-name { color: var(--accent); font-weight: 500; }
    .exp-row-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .exp-row-info { flex: 1; min-width: 0; }
    .exp-row-name {
      font-size: 12.5px;
      color: var(--txt-1);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.4;
    }
    .exp-row-meta { font-size: 10.5px; color: var(--txt-3); margin-top: 1px; }

    /* ── STATUS BADGES ── */
    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 7px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }
    .badge-running   { background: #dbeafe; color: #1d4ed8; }
    .badge-completed { background: #d1fae5; color: #065f46; }
    .badge-draft     { background: #f3f4f6; color: #6b7280; }
    .badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge-running .badge-dot { animation: blink 1.8s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* ── MAIN ── */
    .main { flex: 1; overflow-y: auto; }
    .main-inner { padding: 28px 32px; max-width: 960px; }

    /* ── EXP HEADER ── */
    .exp-header { margin-bottom: 24px; }
    .exp-title-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }
    .exp-title { font-size: 18px; font-weight: 600; color: var(--txt-1); }
    .exp-meta { font-size: 12px; color: var(--txt-3); display: flex; align-items: center; gap: 8px; }
    .exp-meta-sep { color: var(--border); }
    .exp-progress {
      margin-top: 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .progress-bar-wrap {
      flex: 1; height: 3px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill { height: 100%; background: #3b82f6; border-radius: 99px; transition: width 0.3s; }
    .progress-label { font-size: 11px; color: var(--txt-3); white-space: nowrap; }

    /* ── SECTION LABEL ── */
    .section-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--txt-3);
      margin-bottom: 10px;
    }

    /* ── HYPOTHESIS BOX ── */
    .hypothesis-block {
      margin-bottom: 24px;
    }
    .hypothesis-text {
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius-md);
      font-size: 13px;
      color: var(--txt-1);
      line-height: 1.7;
    }

    /* ── METRIC GRID ── */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }
    @media (max-width: 800px) { .metric-grid { grid-template-columns: repeat(2, 1fr); } }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      transition: border-color 0.12s;
    }
    .metric-card:hover { border-color: #c8c7c3; }
    .metric-card-top {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .metric-source-badge {
      font-size: 10px; font-weight: 500;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      color: var(--txt-3);
    }
    .metric-cat-icon { font-size: 13px; }
    .metric-name {
      font-size: 12px;
      color: var(--txt-2);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .metric-values { display: flex; flex-direction: column; gap: 3px; }
    .metric-row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .metric-row-label { font-size: 11px; color: var(--txt-3); }
    .metric-before { font-size: 13px; font-weight: 500; color: var(--txt-2); }
    .metric-after  { font-size: 14px; font-weight: 600; color: var(--txt-1); }
    .metric-after.none { color: var(--txt-3); font-weight: 400; }
    .metric-change {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border-2);
      display: flex; align-items: center; justify-content: space-between;
    }
    .metric-change-label { font-size: 11px; color: var(--txt-3); }
    .chip-up   { background: #d1fae5; color: #065f46; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
    .chip-down { background: #fee2e2; color: #991b1b; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; }
    .chip-neutral { background: var(--bg); color: var(--txt-3); font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--border); }

    /* ── CHART SECTION ── */
    .chart-section { margin-bottom: 24px; }
    .chart-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .chart-tabs { display: flex; gap: 4px; }
    .chart-tab {
      padding: 4px 10px;
      font-size: 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--txt-2);
      cursor: pointer;
      transition: all 0.1s;
    }
    .chart-tab:hover { background: var(--bg); }
    .chart-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
    }

    /* ── TAGS ── */
    .exp-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .tag-pill {
      padding: 2px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 11px;
      color: var(--txt-2);
    }

    /* ── SUMMARY STATS ── */
    .summary-row {
      display: flex; gap: 16px;
      margin-bottom: 20px;
    }
    .summary-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 16px;
      text-align: center;
      min-width: 80px;
    }
    .summary-num { font-size: 20px; font-weight: 700; color: var(--txt-1); }
    .summary-num.green { color: #059669; }
    .summary-desc { font-size: 10.5px; color: var(--txt-3); margin-top: 1px; }

    /* ── EMPTY / DRAFT ── */
    .empty-chart {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
      padding: 40px;
      text-align: center;
      color: var(--txt-3);
      font-size: 13px;
    }
    .empty-chart-icon { font-size: 28px; margin-bottom: 8px; }

    /* ── EMPTY MAIN ── */
    .empty-main {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; color: var(--txt-3); font-size: 13px;
    }
    .empty-main-icon {
      width: 44px; height: 44px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      margin-bottom: 12px;
    }

    /* ── MODAL ── */
    .modal-bg {
      display: none;
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(2px);
      align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      margin: 16px;
    }
    .modal-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title { font-size: 14px; font-weight: 600; color: var(--txt-1); }
    .modal-close {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      background: none; border: none;
      color: var(--txt-3); cursor: pointer; border-radius: var(--radius-sm);
      transition: background 0.1s;
    }
    .modal-close:hover { background: var(--bg); color: var(--txt-1); }
    .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
    .modal-footer { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 6px; }

    .form-label { display: block; font-size: 11.5px; font-weight: 500; color: var(--txt-2); margin-bottom: 5px; }
    .form-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-size: 13px;
      color: var(--txt-1);
      background: var(--surface);
      outline: none;
      transition: border-color 0.1s;
      font-family: inherit;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--txt-3); }
    textarea.form-input { resize: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-unit-wrap { position: relative; }
    .form-unit-wrap input { padding-right: 28px; }
    .form-unit { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--txt-3); pointer-events: none; }

    .analyze-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: none;
      font-size: 12px; color: var(--accent);
      font-weight: 500; cursor: pointer; padding: 0;
      margin-top: 6px;
      opacity: 0.4;
      pointer-events: none;
      transition: opacity 0.15s;
      font-family: inherit;
    }
    .analyze-btn.ready { opacity: 1; pointer-events: auto; }
    .analyze-btn:hover { text-decoration: underline; }

    .analysis-box {
      display: none;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
    }
    .analysis-box.open { display: block; }
    .analysis-section-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--txt-3); margin-bottom: 6px; }
    .theme-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
    .theme-tag { padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }

    .metric-check-group { margin-bottom: 10px; }
    .metric-check-divider {
      display: flex; align-items: center; gap: 8px;
      margin: 8px 0 5px;
      font-size: 10px; font-weight: 600; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--txt-3);
    }
    .metric-check-divider::before, .metric-check-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .metric-check-item {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 6px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.08s;
    }
    .metric-check-item:hover { background: var(--surface); }
    .metric-check-item input { accent-color: var(--accent); cursor: pointer; }
    .metric-check-name { flex: 1; font-size: 12.5px; color: var(--txt-1); }
    .metric-check-unit { font-size: 11px; color: var(--txt-3); }
    .metric-check-src { font-size: 10px; color: var(--txt-3); background: var(--surface); border: 1px solid var(--border); padding: 1px 5px; border-radius: 3px; }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-brand">
    <div class="brand-icon">E</div>
    실험 대시보드
  </div>
  <div class="breadcrumb" id="breadcrumb">
    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    <span id="breadcrumb-title">실험을 선택하세요</span>
  </div>
  <div class="topbar-right">
    <div class="conn-badge"><div class="conn-dot"></div> BigQuery 미연결</div>
    <div class="conn-badge"><div class="conn-dot"></div> GA4 미연결</div>
    <button class="btn-primary" onclick="openModal()">
      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
      새 실험
    </button>
  </div>
</div>

<!-- LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-search">
      <input type="text" placeholder="실험 검색…" oninput="filterList(this.value)">
    </div>
    <div class="sidebar-body" id="sidebar"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="main-inner" id="main"></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">새 실험 만들기</span>
      <button class="modal-close" onclick="closeModal()">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div>
        <label class="form-label">실험명</label>
        <input id="f-name" class="form-input" type="text" placeholder="예: 상품 이미지 확대 A/B 테스트">
      </div>
      <div>
        <label class="form-label">가설</label>
        <textarea id="f-hypothesis" class="form-input" rows="3" oninput="onHypInput()"
          placeholder="예: 상품 이미지를 크게 보여주면 구매전환율이 높아질 것이다"></textarea>
        <button id="analyze-btn" class="analyze-btn" onclick="runAnalysis()">
          <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          가설 분석 → 지표 추천
        </button>
      </div>

      <div id="analysis-box" class="analysis-box">
        <div class="analysis-section-label">감지된 주제</div>
        <div id="detected-tags" class="theme-tags"></div>
        <div class="analysis-section-label">추천 지표</div>
        <div id="metric-list" class="metric-check-group"></div>
      </div>

      <div class="form-row">
        <div>
          <label class="form-label">시작일</label>
          <input id="f-start" class="form-input" type="date">
        </div>
        <div>
          <label class="form-label">기간</label>
          <div class="form-unit-wrap">
            <input id="f-dur" class="form-input" type="number" value="14" min="1" max="90">
            <span class="form-unit">일</span>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">취소</button>
      <button class="btn-primary" onclick="createExp()">실험 생성</button>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const EXPERIMENTS = [
  {
    id:'exp-001', name:'상품 이미지 확대 테스트',
    hypothesis:'상품 상세페이지에서 메인 이미지를 더 크게 노출하면 상품에 대한 신뢰도가 높아져 구매전환율이 5% 이상 증가할 것이다.',
    status:'completed', startDate:'2024-06-10', durationDays:21, tags:['전환','상품상세'],

function fd(s){const d=new Date(s+'T00:00:00');return`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;}
function endDate(e){const d=new Date(e.startDate+'T00:00:00');d.setDate(d.getDate()+e.durationDays);return d.toISOString().split('T')[0];}
function ch(baseline,current,dir){if(current==null)return null;const p=((current-baseline)/baseline)*100;return{pct:p,isGood:dir==='up_is_good'?p>0:p<0};}
function fv(v,unit){
  if(v==null)return'—';
  if(unit==='%')return v.toFixed(1)+'%';
  if(unit==='만원')return v.toLocaleString()+'만원';
  if(unit==='원')return v.toLocaleString()+'원';
  if(unit==='초'){const m=Math.floor(v/60),s=Math.round(v%60);return m>0?`${m}분 ${s}초`:`${s}초`;}
  if(unit==='PV')return v.toLocaleString()+' PV';
  return v.toLocaleString()+(unit?' '+unit:'');
}
function daysSince(s){return Math.max(0,Math.floor((Date.now()-new Date(s+'T00:00:00'))/86400000));}

function renderSidebar(){
  const q=state.filter.toLowerCase();
  const filtered=state.experiments.filter(e=>!q||e.name.toLowerCase().includes(q)||e.hypothesis.toLowerCase().includes(q));
  const groups={running:filtered.filter(e=>e.status==='running'),completed:filtered.filter(e=>e.status==='completed'),draft:filtered.filter(e=>e.status==='draft')};
  const labels={running:'진행 중',completed:'완료',draft:'기획 중'};
  let html='';
  for(const[key,exps]of Object.entries(groups)){
    if(!exps.length)continue;
    html+=`<div class="sidebar-group-label">${labels[key]} (${exps.length})</div>`;
    for(const exp of exps){
      const d=daysSince(exp.startDate);
      const meta=exp.status==='running'?`D+${Math.min(d,exp.durationDays)} · ${Math.max(0,exp.durationDays-d)}일 남음`:
                 exp.status==='completed'?`${exp.durationDays}일 · ${fd(endDate(exp))} 완료`:
                 `${fd(exp.startDate)} 예정`;
      html+=`<div class="exp-row${exp.id===state.selectedId?' active':''}" onclick="selectExp('${exp.id}')">
        <div class="exp-row-dot" style="background:${DOT_COLOR[exp.status]||'#d1d5db'}"></div>
        <div class="exp-row-info">
          <div class="exp-row-name">${exp.name}</div>
          <div class="exp-row-meta">${meta}</div>
        </div>
      </div>`;
    }
  }
  document.getElementById('sidebar').innerHTML=html||'<div style="padding:20px;text-align:center;color:var(--txt-3);font-size:12px;">검색 결과 없음</div>';
}

      </div>

// ─────────────────────────────────────────────
// CHARTS
// ─────────────────────────────────────────────
function renderTrend(exp,idx){
  if(charts.trend){charts.trend.destroy();delete charts.trend;}
  const canvas=document.getElementById('trend-chart');
  if(!canvas)return;
  const m=exp.metrics[idx];
  if(!m?.trend?.length)return;
  const c=ch(m.baseline,m.current,m.direction);
  const color=c?(c.isGood?'#10b981':'#ef4444'):'#5b5bd6';
  charts.trend=new Chart(canvas.getContext('2d'),{
    type:'line',
    data:{
      labels:m.trend.map((_,i)=>`D+${i+1}`),
      datasets:[
        {label:m.name,data:m.trend,borderColor:color,backgroundColor:color+'18',fill:true,tension:0.4,pointRadius:2.5,pointHoverRadius:4,pointBackgroundColor:color,borderWidth:1.8},
        {label:'베이스라인',data:Array(m.trend.length).fill(m.baseline),borderColor:'#d1d5db',borderDash:[4,4],fill:false,pointRadius:0,borderWidth:1.2,tension:0}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{position:'top',labels:{font:{size:11,family:'inherit'},usePointStyle:true,boxWidth:8,padding:14}},tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fv(ctx.raw,m.unit)}`}}},
      scales:{
        x:{grid:{color:'#f0efec'},ticks:{font:{size:11,family:'inherit'},color:'#a8a7a2'}},
        y:{grid:{color:'#f0efec'},ticks:{font:{size:11,family:'inherit'},color:'#a8a7a2',callback:v=>fv(v,m.unit)}}
      }
    }
  });
}

function renderCompare(exp){
  if(charts.compare){charts.compare.destroy();delete charts.compare;}
  const canvas=document.getElementById('compare-chart');
  if(!canvas)return;
  const ms=exp.metrics.filter(m=>m.current!==null);
  const changes=ms.map(m=>ch(m.baseline,m.current,m.direction));
  const colors=changes.map(c=>c?.isGood?'#10b981':'#ef4444');
  charts.compare=new Chart(canvas.getContext('2d'),{
    type:'bar',
    data:{
      labels:ms.map(m=>m.name),
      datasets:[{label:'변화율(%)',data:changes.map(c=>c?+c.pct.toFixed(2):0),backgroundColor:colors.map(c=>c+'bb'),borderColor:colors,borderWidth:1.2,borderRadius:4}]
    },
    options:{
      responsive:true,maintainAspectRatio:true,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw>0?'+':''}${ctx.raw}%`}}},
      scales:{
        x:{grid:{display:false},ticks:{font:{size:11,family:'inherit'},color:'#a8a7a2'}},
        y:{grid:{color:'#f0efec'},ticks:{font:{size:11,family:'inherit'},color:'#a8a7a2',callback:v=>`${v>0?'+':''}${v}%`}}
      }
    }
  });
}

function switchMetric(idx){
  const exp=state.experiments.find(e=>e.id===state.selectedId);
  if(!exp)return;
  exp.metrics.forEach((_,i)=>{
    const b=document.getElementById(`ct-${i}`);
    if(b)b.className='chart-tab'+(i===idx?' active':'');
  });
  renderTrend(exp,idx);
}

function runAnalysis(){
  const hyp=document.getElementById('f-hypothesis').value.toLowerCase();
  const detected=new Set(['conversion']);
  KW_RULES.forEach(r=>{if(r.kw.some(k=>hyp.includes(k)))detected.add(r.cat);});

  document.getElementById('detected-tags').innerHTML=[...detected].map(cat=>{
    const lib=METRIC_LIB[cat];
    return`<span class="theme-tag" style="${THEME_COLORS[cat]||''}">${lib?.label||cat}</span>`;
  }).join('');

  selectedMetrics.clear();
  let html='';
  for(const cat of detected){
    const lib=METRIC_LIB[cat];if(!lib)continue;
    html+=`<div class="metric-check-divider">${lib.label}</div>`;
    lib.metrics.forEach((m,i)=>{
      const checked=i<2;if(checked)selectedMetrics.add(m.id);
      html+=`<label class="metric-check-item">
        <input type="checkbox" value="${m.id}" ${checked?'checked':''} onchange="toggleM('${m.id}',this.checked)">
        <span class="metric-check-name">${m.name}</span>
        <span class="metric-check-unit">(${m.unit})</span>
        <span class="metric-check-src">${m.source}</span>
      </label>`;
    });
  }
  document.getElementById('metric-list').innerHTML=html;
  document.getElementById('analysis-box').classList.add('open');
}
function toggleM(id,checked){checked?selectedMetrics.add(id):selectedMetrics.delete(id);}

function createExp(){
  const name=document.getElementById('f-name').value.trim();
  const hyp=document.getElementById('f-hypothesis').value.trim();
  const start=document.getElementById('f-start').value;
  const dur=parseInt(document.getElementById('f-dur').value)||14;
  if(!name||!hyp||!start){alert('실험명, 가설, 시작일을 입력해주세요.');return;}

  const metrics=[];
  for(const cat of Object.values(METRIC_LIB))
    for(const m of cat.metrics)
      if(selectedMetrics.has(m.id))
        metrics.push({id:m.id+'_'+Date.now(),name:m.name,unit:m.unit,source:m.source,direction:m.direction,category:m.category,baseline:m.defaultBaseline,current:null,trend:[]});

  if(!metrics.length)metrics.push(
    {id:'d1_'+Date.now(),name:'구매전환율', unit:'%',    source:'GA4',      direction:'up_is_good',category:'conversion',baseline:3.0, current:null,trend:[]},
    {id:'d2_'+Date.now(),name:'세션수',     unit:'세션', source:'GA4',      direction:'up_is_good',category:'traffic',   baseline:8000,current:null,trend:[]},
    {id:'d3_'+Date.now(),name:'일평균 매출',unit:'만원', source:'BigQuery', direction:'up_is_good',category:'revenue',   baseline:1100,current:null,trend:[]},
  );

  const lo=hyp.toLowerCase();
  const tags=[];
  if(/전환|구매|결제/.test(lo))tags.push('전환');
  if(/매출|수익/.test(lo))tags.push('매출');
  if(/클릭|ctr|배너/.test(lo))tags.push('CTR');
  if(/쿠폰|할인/.test(lo))tags.push('쿠폰');

  state.experiments.unshift({id:'exp-'+Date.now(),name,hypothesis:hyp,status:'draft',startDate:start,durationDays:dur,tags:tags.length?tags:['신규'],metrics});
  state.selectedId=state.experiments[0].id;
  closeModal();renderSidebar();renderMain();
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
renderSidebar();
renderMain();
</script>
