<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실험 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .exp-card { cursor: pointer; transition: background 0.12s; border-left: 3px solid transparent; }
    .exp-card:hover { background: #f8fafc; }
    .exp-card.active { background: #eef2ff; border-left-color: #6366f1; }
    .metric-card { transition: transform 0.15s, box-shadow 0.15s; }
    .metric-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
    .hypothesis-box { border-left: 3px solid #6366f1; background: #fafafa; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 500; }
    .modal-overlay { backdrop-filter: blur(3px); }
    .pulse-dot { animation: pulse-anim 1.8s infinite; }
    @keyframes pulse-anim {
      0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
    }
  </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">

<!-- ── HEADER ── -->
<header class="bg-white border-b border-slate-200 px-6 py-3.5 flex items-center justify-between flex-shrink-0">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-sm">E</div>
    <div>
      <h1 class="text-base font-semibold text-slate-900 leading-tight">실험 대시보드</h1>
      <p class="text-xs text-slate-400">Experiment Tracker · dummy data</p>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <span class="tag bg-slate-100 text-slate-400">BigQuery 미연결</span>
    <span class="tag bg-slate-100 text-slate-400">GA4 미연결</span>
    <button onclick="openModal()" class="ml-2 bg-indigo-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors font-medium flex items-center gap-1.5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
      새 실험
    </button>
  </div>
</header>

<!-- ── LAYOUT ── -->
<div class="flex flex-1 overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-68 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 overflow-hidden" style="width:272px">
    <div class="px-3 py-3 border-b border-slate-100">
      <input type="text" placeholder="실험 검색…" oninput="filterList(this.value)"
        class="w-full text-sm bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-300">
    </div>
    <div id="sidebar" class="flex-1 overflow-y-auto py-2"></div>
  </aside>

  <!-- MAIN -->
  <main id="main" class="flex-1 overflow-y-auto"></main>
</div>

<!-- ── CREATE MODAL ── -->
<div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/25">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl mx-4 max-h-[90vh] overflow-y-auto">
    <div class="p-5 border-b border-slate-100 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-slate-900">새 실험 만들기</h2>
      <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="p-5 space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">실험명</label>
        <input id="f-name" type="text" placeholder="예: 상품 이미지 확대 A/B 테스트"
          class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">가설</label>
        <textarea id="f-hypothesis" rows="3" oninput="onHypInput()"
          placeholder="예: 상품 이미지를 크게 보여주면 구매전환율이 높아질 것이다"
          class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"></textarea>
        <button id="analyze-btn" onclick="runAnalysis()" disabled
          class="mt-2 text-sm text-indigo-600 font-medium flex items-center gap-1 opacity-40 cursor-not-allowed transition-opacity">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          가설 분석 → 지표 추천
        </button>
      </div>

      <!-- Analysis result -->
      <div id="analysis-area" class="hidden space-y-3">
        <div class="bg-indigo-50 rounded-xl p-3">
          <p class="text-xs font-semibold text-indigo-600 uppercase tracking-wide mb-2">감지된 주제</p>
          <div id="detected-tags" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div>
          <p class="text-sm font-medium text-slate-700 mb-2">추천 지표 <span class="text-slate-400 font-normal">(선택)</span></p>
          <div id="metric-list" class="space-y-1.5"></div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">시작일</label>
          <input id="f-start" type="date" class="w-full border border-slate-200 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">기간</label>
          <div class="relative">
            <input id="f-dur" type="number" value="14" min="1" max="90"
              class="w-full border border-slate-200 rounded-lg px-3 py-2.5 pr-8 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
            <span class="absolute right-3 top-2.5 text-sm text-slate-400">일</span>
          </div>
        </div>
      </div>
    </div>
    <div class="p-5 pt-0 flex justify-end gap-2">
      <button onclick="closeModal()" class="text-sm text-slate-600 px-4 py-2 border border-slate-200 rounded-lg hover:bg-slate-50">취소</button>
      <button onclick="createExp()" class="text-sm bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 font-medium">실험 생성</button>
    </div>
  </div>
</div>

// ============================================================

const KW_RULES = [
  { cat:'conversion', kw:['전환','구매','주문','결제','conversion'] },

// ============================================================
// STATE
// ============================================================
let state = {
  experiments: JSON.parse(JSON.stringify(EXPERIMENTS)),
  selectedId: 'exp-001',
  filter: '',
  charts: {}
};
let selectedMetrics = new Set();

// ============================================================
// UTILS
// ============================================================
function fmtDate(s) {
  const d = new Date(s + 'T00:00:00');
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}
function endDate(exp) {
  const d = new Date(exp.startDate + 'T00:00:00');
  d.setDate(d.getDate() + exp.durationDays);
  return d.toISOString().split('T')[0];
}
function change(baseline, current, dir) {
  if (current === null || current === undefined) return null;
  const pct = ((current - baseline) / baseline) * 100;
  return { pct, isGood: dir === 'up_is_good' ? pct > 0 : pct < 0 };
}
function fmtVal(v, unit) {
  if (v === null || v === undefined) return '—';
  if (unit === '%')    return v.toFixed(1) + '%';
  if (unit === '만원') return v.toLocaleString() + '만원';
  if (unit === '원')   return v.toLocaleString() + '원';
  if (unit === '초')   { const m=Math.floor(v/60),s=Math.round(v%60); return m>0?`${m}분 ${s}초`:`${s}초`; }
  if (unit === 'PV')   return v.toLocaleString() + ' PV';
  return v.toLocaleString() + (unit ? ' ' + unit : '');
}
function statusCfg(status) {
  return {
    draft:     { label:'기획 중', bg:'bg-slate-100',   text:'text-slate-500',  dot:'#9ca3af' },
    running:   { label:'진행 중', bg:'bg-blue-50',     text:'text-blue-600',   dot:'#3b82f6' },
    completed: { label:'완료',    bg:'bg-emerald-50',  text:'text-emerald-600',dot:'#10b981' },
  }[status] || { label:status, bg:'bg-slate-100', text:'text-slate-500', dot:'#9ca3af' };
}
function daysSince(dateStr) {
  return Math.max(0, Math.floor((Date.now() - new Date(dateStr+'T00:00:00')) / 86400000));
}

// ============================================================
// SIDEBAR
// ============================================================
function renderSidebar() {
  const q = state.filter.toLowerCase();
  const filtered = state.experiments.filter(e =>
    !q || e.name.toLowerCase().includes(q) || e.hypothesis.toLowerCase().includes(q)
  );
  const groups = {
    running:   filtered.filter(e => e.status === 'running'),
    completed: filtered.filter(e => e.status === 'completed'),
    draft:     filtered.filter(e => e.status === 'draft'),
  };
  const titles = { running:'진행 중', completed:'완료', draft:'기획 중' };

  let html = '';
  for (const [key, exps] of Object.entries(groups)) {
    if (!exps.length) continue;
    html += `<div class="mb-1">
      <div class="px-4 py-1.5">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">${titles[key]} (${exps.length})</span>
      </div>`;
    for (const exp of exps) {
      const sc = statusCfg(exp.status);
      const active = exp.id === state.selectedId;
      const d = daysSince(exp.startDate);
      html += `<div class="exp-card mx-2 px-3 py-3 rounded-xl mb-0.5 ${active ? 'active' : ''}" onclick="selectExp('${exp.id}')">
        <p class="text-sm font-medium text-slate-800 leading-tight mb-1.5">${exp.name}</p>
        <div class="flex items-center gap-2">
          <span class="tag ${sc.bg} ${sc.text}">${sc.label}</span>
          <span class="text-xs text-slate-400">${
            exp.status === 'running' ? `D+${Math.min(d, exp.durationDays)}` :
            exp.status === 'completed' ? `${exp.durationDays}일` :
            fmtDate(exp.startDate) + ' 예정'
          }</span>
        </div>
      </div>`;
    }
    html += '</div>';
  }
  document.getElementById('sidebar').innerHTML = html || '<p class="text-center text-sm text-slate-400 mt-8">검색 결과 없음</p>';
}

// ============================================================
// MAIN CONTENT
// ============================================================
function renderMain() {
  const el = document.getElementById('main');
  if (!state.selectedId) {
    el.innerHTML = `<div class="flex items-center justify-center h-full text-slate-400 text-sm">실험을 선택하거나 새로 만들어보세요</div>`;
    return;
  }
  const exp = state.experiments.find(e => e.id === state.selectedId);
  if (!exp) return;

  const sc = statusCfg(exp.status);
  const end = endDate(exp);
  const d = daysSince(exp.startDate);
  const metricsWithData = exp.metrics.filter(m => m.current !== null);
  const improved = metricsWithData.filter(m => change(m.baseline, m.current, m.direction)?.isGood);

  const catIcon = { conversion:'🎯', revenue:'💰', traffic:'📈', engagement:'⏱️' };
  const srcColor = { GA4:'bg-orange-50 text-orange-600', BigQuery:'bg-blue-50 text-blue-600', Internal:'bg-purple-50 text-purple-600' };

  // Metric cards
  const metricCards = exp.metrics.map(m => {
    const ch = change(m.baseline, m.current, m.direction);
    const changeHtml = ch
      ? `<div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
           <span class="text-xs text-slate-400">변화량</span>
           <span class="text-sm font-bold px-2 py-0.5 rounded-lg ${ch.isGood ? 'text-emerald-600 bg-emerald-50' : 'text-red-500 bg-red-50'}">
             ${ch.pct > 0 ? '▲' : '▼'} ${Math.abs(ch.pct).toFixed(1)}%
           </span>
         </div>`
      : m.current === null
      ? `<div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
           <span class="text-xs text-slate-400">현황</span>
           <span class="text-xs text-slate-300">수집 대기</span>
         </div>`
      : '';
    return `
      <div class="metric-card bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
        <div class="flex items-center justify-between mb-3">
          <span class="text-base">${catIcon[m.category] || '📊'}</span>
          <span class="tag text-xs ${srcColor[m.source] || 'bg-slate-100 text-slate-500'}">${m.source}</span>
        </div>
        <p class="text-sm font-medium text-slate-700 mb-3 leading-tight">${m.name}</p>
        <div class="space-y-1.5">
          <div class="flex items-center justify-between">
            <span class="text-xs text-slate-400">Before</span>
            <span class="text-sm font-semibold text-slate-500">${fmtVal(m.baseline, m.unit)}</span>
          </div>
          <div class="flex items-center justify-between">
            <span class="text-xs text-slate-400">After</span>
            <span class="text-sm font-semibold ${m.current !== null ? 'text-slate-900' : 'text-slate-300'}">${fmtVal(m.current, m.unit)}</span>
          </div>
        </div>
        ${changeHtml}
      </div>`;
  }).join('');

  // Progress bar (running)
  const progressHtml = exp.status === 'running' ? `
    <div class="mt-3">
      <div class="flex items-center justify-between text-xs text-slate-400 mb-1">
        <span>D+${Math.min(d, exp.durationDays)} 경과</span>
        <span>${Math.max(0, exp.durationDays - d)}일 남음</span>
      </div>
      <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full bg-blue-400 rounded-full transition-all" style="width:${Math.min(100, Math.round(d/exp.durationDays*100))}%"></div>
      </div>
    </div>` : '';

  // Chart tabs
  const chartTabsHtml = exp.status !== 'draft' && exp.metrics.length
    ? `<div class="flex flex-wrap gap-1.5" id="chart-tabs">
        ${exp.metrics.map((m,i) => `
          <button onclick="switchMetric(${i})" id="ct-${i}"
            class="text-xs px-3 py-1.5 rounded-lg transition-colors ${i===0?'bg-indigo-600 text-white':'bg-white text-slate-500 border border-slate-200 hover:bg-slate-50'}">
            ${m.name}
          </button>`).join('')}
       </div>` : '';

  el.innerHTML = `
    <div class="p-8 max-w-6xl">

      <!-- Header -->
      <div class="mb-7">
        <div class="flex items-start justify-between">
          <div>
            <div class="flex items-center gap-3 mb-1.5">
              <h2 class="text-2xl font-bold text-slate-900">${exp.name}</h2>
              <span class="tag ${sc.bg} ${sc.text} px-3 py-1 text-sm">${sc.label}</span>
            </div>
            <p class="text-sm text-slate-500">📅 ${fmtDate(exp.startDate)} ~ ${fmtDate(end)} · ${exp.durationDays}일</p>
            ${progressHtml}
          </div>
          ${metricsWithData.length ? `
            <div class="flex gap-5 text-center ml-6">
              <div><div class="text-2xl font-bold text-slate-800">${metricsWithData.length}</div><div class="text-xs text-slate-400 mt-0.5">추적 지표</div></div>
              <div><div class="text-2xl font-bold text-emerald-600">${improved.length}</div><div class="text-xs text-slate-400 mt-0.5">개선 지표</div></div>
            </div>` : ''}
        </div>
        <div class="flex gap-1.5 mt-3">
          ${exp.tags.map(t => `<span class="tag bg-slate-100 text-slate-500">#${t}</span>`).join('')}
        </div>
      </div>

      <!-- Hypothesis -->
      <div class="mb-7">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">가설</p>
        <div class="hypothesis-box rounded-xl p-4">
          <p class="text-slate-700 leading-relaxed">"${exp.hypothesis}"</p>
        </div>
      </div>

      <!-- Metrics -->
      <div class="mb-8">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
          핵심 지표
          ${exp.status === 'draft' ? '<span class="text-slate-300 font-normal normal-case text-xs ml-1">(실험 시작 후 After 값이 채워집니다)</span>' : ''}
        </p>
        <div class="grid grid-cols-2 xl:grid-cols-4 gap-4">${metricCards}</div>
      </div>

      ${exp.status !== 'draft' ? `
        <!-- Trend chart -->
        <div class="mb-6">
          <div class="flex items-center justify-between mb-3">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">지표 추이</p>
            ${chartTabsHtml}
          </div>
          <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
            <canvas id="trend-chart" height="90"></canvas>
          </div>
        </div>

        ${metricsWithData.length ? `
          <!-- Before/After -->
          <div>
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Before / After 변화율</p>
            <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-5">
              <canvas id="compare-chart" height="70"></canvas>
            </div>
          </div>` : ''}
      ` : `
        <div class="bg-white rounded-2xl border border-dashed border-slate-200 p-10 text-center">
          <div class="text-3xl mb-2">📊</div>
          <p class="text-slate-400 text-sm">실험이 시작되면 지표 추이가 여기에 표시됩니다</p>
          <p class="text-slate-300 text-xs mt-1">시작 예정: ${fmtDate(exp.startDate)}</p>
        </div>`}
    </div>`;

  if (exp.status !== 'draft') {
    setTimeout(() => {
      renderTrend(exp, 0);
      if (metricsWithData.length) renderCompare(exp);
    }, 30);
  }
}

// ============================================================
// CHARTS
// ============================================================
function renderTrend(exp, idx) {
  if (state.charts.trend) { state.charts.trend.destroy(); delete state.charts.trend; }
  const canvas = document.getElementById('trend-chart');
  if (!canvas) return;
  const m = exp.metrics[idx];
  if (!m?.trend?.length) return;

  const ch = change(m.baseline, m.current, m.direction);
  const lineColor = ch ? (ch.isGood ? '#10b981' : '#ef4444') : '#6366f1';

  state.charts.trend = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels: m.trend.map((_,i) => `D+${i+1}`),
      datasets: [
        {
          label: m.name,
          data: m.trend,
          borderColor: lineColor,
          backgroundColor: lineColor + '18',
          fill: true,
          tension: 0.4,
          pointRadius: 3,
          pointHoverRadius: 5,
          pointBackgroundColor: lineColor,
          borderWidth: 2,
        },
        {
          label: '베이스라인',
          data: Array(m.trend.length).fill(m.baseline),
          borderColor: '#cbd5e1',
          borderDash: [5,5],
          fill: false,
          pointRadius: 0,
          borderWidth: 1.5,
          tension: 0,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { position:'top', labels:{ font:{size:11}, usePointStyle:true } },
        tooltip: { callbacks:{ label: ctx => `${ctx.dataset.label}: ${fmtVal(ctx.raw, m.unit)}` } }
      },
      scales: {
        x: { grid:{color:'#f1f5f9'}, ticks:{font:{size:11}} },
        y: { grid:{color:'#f1f5f9'}, ticks:{ font:{size:11}, callback: v => fmtVal(v, m.unit) } }
      }
    }
  });
}

function renderCompare(exp) {
  if (state.charts.compare) { state.charts.compare.destroy(); delete state.charts.compare; }
  const canvas = document.getElementById('compare-chart');
  if (!canvas) return;

  const metrics = exp.metrics.filter(m => m.current !== null);
  const changes = metrics.map(m => change(m.baseline, m.current, m.direction));
  const colors = changes.map(ch => ch?.isGood ? '#10b981' : '#ef4444');

  state.charts.compare = new Chart(canvas.getContext('2d'), {
    type: 'bar',
    data: {
      labels: metrics.map(m => m.name),
      datasets: [{
        label: '변화율 (%)',
        data: changes.map(ch => ch ? +ch.pct.toFixed(2) : 0),
        backgroundColor: colors.map(c => c + 'cc'),
        borderColor: colors,
        borderWidth: 1.5,
        borderRadius: 6,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display:false },
        tooltip: { callbacks:{ label: ctx => `${ctx.raw > 0 ? '+' : ''}${ctx.raw}%` } }
      },
      scales: {
        x: { grid:{display:false}, ticks:{font:{size:11}} },
        y: { grid:{color:'#f1f5f9'}, ticks:{ font:{size:11}, callback: v => `${v>0?'+':''}${v}%` } }
      }
    }
  });
}

function switchMetric(idx) {
  const exp = state.experiments.find(e => e.id === state.selectedId);
  if (!exp) return;
  exp.metrics.forEach((_,i) => {
    const b = document.getElementById(`ct-${i}`);
    if (!b) return;
    b.className = i === idx
      ? 'text-xs px-3 py-1.5 rounded-lg transition-colors bg-indigo-600 text-white'
      : 'text-xs px-3 py-1.5 rounded-lg transition-colors bg-white text-slate-500 border border-slate-200 hover:bg-slate-50';
  });
  renderTrend(exp, idx);
}

// ============================================================
// ACTIONS
// ============================================================
function selectExp(id) {
  state.selectedId = id;
  renderSidebar();
  renderMain();
}

function filterList(q) {
  state.filter = q;
  renderSidebar();
}

// ============================================================
// MODAL
// ============================================================
function openModal() {
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('f-start').value = new Date().toISOString().split('T')[0];
  document.getElementById('analysis-area').classList.add('hidden');
  selectedMetrics.clear();
}
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('f-name').value = '';
  document.getElementById('f-hypothesis').value = '';
  document.getElementById('analysis-area').classList.add('hidden');
  const btn = document.getElementById('analyze-btn');
  btn.disabled = true; btn.classList.add('opacity-40','cursor-not-allowed');
}

function onHypInput() {
  const btn = document.getElementById('analyze-btn');
  const v = document.getElementById('f-hypothesis').value.trim();
  if (v.length > 8) {
    btn.disabled = false; btn.classList.remove('opacity-40','cursor-not-allowed');
  } else {
    btn.disabled = true; btn.classList.add('opacity-40','cursor-not-allowed');
  }
}

function runAnalysis() {
  const hyp = document.getElementById('f-hypothesis').value.toLowerCase();
  const detected = new Set(['conversion']);
  KW_RULES.forEach(r => { if (r.kw.some(k => hyp.includes(k))) detected.add(r.cat); });

  // Theme tags
  document.getElementById('detected-tags').innerHTML = [...detected].map(cat => {
    const lib = METRIC_LIB[cat];
    return `<span class="tag ${lib?.color || 'bg-slate-100 text-slate-500'}">${lib?.label || cat}</span>`;
  }).join('');

  // Metric checkboxes
  selectedMetrics.clear();
  let html = '';
  for (const cat of detected) {
    const lib = METRIC_LIB[cat];
    if (!lib) continue;
    html += `<div class="mb-3">
      <div class="flex items-center gap-2 mb-1.5">
        <div class="h-px flex-1 bg-slate-100"></div>
        <span class="text-xs text-slate-400 font-medium">${lib.label}</span>
        <div class="h-px flex-1 bg-slate-100"></div>
      </div>`;
    lib.metrics.forEach((m, i) => {
      const checked = i < 2;
      if (checked) selectedMetrics.add(m.id);
      html += `<label class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-slate-50 cursor-pointer">
        <input type="checkbox" value="${m.id}" ${checked ? 'checked' : ''} onchange="toggleM('${m.id}',this.checked)"
          class="rounded text-indigo-600 focus:ring-indigo-300">
        <span class="text-sm text-slate-700 flex-1">${m.name} <span class="text-slate-400 text-xs">(${m.unit})</span></span>
        <span class="tag bg-slate-100 text-slate-500 text-xs">${m.source}</span>
      </label>`;
    });
    html += '</div>';
  }
  document.getElementById('metric-list').innerHTML = html;
  document.getElementById('analysis-area').classList.remove('hidden');
}

function toggleM(id, checked) {
  checked ? selectedMetrics.add(id) : selectedMetrics.delete(id);
}

function createExp() {
  const name = document.getElementById('f-name').value.trim();
  const hyp  = document.getElementById('f-hypothesis').value.trim();
  const start = document.getElementById('f-start').value;
  const dur   = parseInt(document.getElementById('f-dur').value) || 14;
  if (!name || !hyp || !start) { alert('실험명, 가설, 시작일을 입력해주세요.'); return; }

  const metrics = [];
  for (const cat of Object.values(METRIC_LIB)) {
    for (const m of cat.metrics) {
      if (selectedMetrics.has(m.id)) {
        metrics.push({ id:m.id+'_'+Date.now(), name:m.name, unit:m.unit, source:m.source,
          direction:m.direction, category:m.category, baseline:m.defaultBaseline, current:null, trend:[] });
      }
    }
  }
  if (!metrics.length) {
    metrics.push(
      { id:'d_cvr_'+Date.now(), name:'구매전환율',  unit:'%',    source:'GA4',     direction:'up_is_good', category:'conversion', baseline:3.0,  current:null, trend:[] },
      { id:'d_ses_'+Date.now(), name:'세션수',       unit:'세션', source:'GA4',     direction:'up_is_good', category:'traffic',    baseline:8000, current:null, trend:[] },
      { id:'d_rev_'+Date.now(), name:'일평균 매출',  unit:'만원', source:'BigQuery',direction:'up_is_good', category:'revenue',    baseline:1100, current:null, trend:[] },
    );
  }

  const tags = [];
  const lo = hyp.toLowerCase();
  if (/전환|구매|결제/.test(lo)) tags.push('전환');
  if (/매출|수익/.test(lo))      tags.push('매출');
  if (/클릭|ctr|배너/.test(lo))  tags.push('CTR');
  if (/쿠폰|할인/.test(lo))      tags.push('쿠폰');

  const newExp = { id:'exp-'+Date.now(), name, hypothesis:hyp, status:'draft', startDate:start,
    durationDays:dur, tags:tags.length?tags:['신규실험'], metrics };

  state.experiments.unshift(newExp);
  state.selectedId = newExp.id;
  closeModal();
  renderSidebar();
  renderMain();
}

// ============================================================
// INIT
// ============================================================
renderSidebar();
renderMain();
</script>
</body>
</html>
